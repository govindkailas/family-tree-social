version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "govindkailas"
    assignees:
      - "govindkailas"
    ignore:
      # TypeScript 7 (native/Go compiler) isn't supported by Next.js or
      # typescript-eslint yet — major bumps break the Vercel build.
      # Revisit once the toolchain officially supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]